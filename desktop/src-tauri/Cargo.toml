[package]
name = "vero-desktop"
version = "1.0.0"
description = "Native desktop shell for Vero"
authors = ["Vero"]
edition = "2021"
rust-version = "1.77"

# The binary name becomes the executable name inside the installer.
[[bin]]
name = "vero-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
# Required by `tauri::generate_context!` as soon as tauri.conf.json carries a
# `plugins` block: the macro bakes the plugin config in as a serde_json value
# and emits `::serde_json::...` paths, which only resolve if the crate depends
# on serde_json directly. Nothing in this file uses it by hand.
serde_json = "1"
# Opens external links (support pages, Stripe receipts, OAuth consent) in the
# user's real browser instead of trapping them in the app window.
tauri-plugin-opener = "2"
# Registers the `vero://` URL scheme so the web app (and later the OAuth return
# path) can hand a destination to this window. The installer does the actual OS
# registration — see the `plugins.deep-link` block in tauri.conf.json.
tauri-plugin-deep-link = "2"
# Native notifications, shown from inside the validated `desktop_notify`
# command. The remote origin never gets the plugin's own permissions.
tauri-plugin-notification = "2"
# Remembers size/position of the main window and every pop-out.
tauri-plugin-window-state = "2"
# Launch-at-login. Registered, but OFF until the user turns it on.
tauri-plugin-autostart = "2"
# Reachability probe for the boot page (HEAD, 2.5 s timeout). Blocking client,
# run on a worker thread only when the boot page asks — never on a timer.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Auto-updater: compiled only with `--features updater`. Off by default and
# carries no endpoint or public key — see README "Auto-update".
tauri-plugin-updater = { version = "2", optional = true }

# Windows and Linux hand a deep link to a NEW process; without this, clicking a
# `vero://` link while the app is already open would start a second copy. The
# `deep-link` feature makes this plugin forward that process's argv into the
# running instance's deep-link handler instead. macOS routes URLs to the running
# app itself, so it neither needs nor uses this.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Global hotkey: desktop-only crate (it does not build for mobile targets).
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-global-shortcut = "2"

# OS keychain for the Supabase session (`desktop_secure_*`). One backend per
# platform, chosen explicitly so nothing falls back to an in-memory mock.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[features]
# `cargo build --features updater` compiles the updater plugin in. Even then it
# does nothing until tauri.conf.json carries `plugins.updater` with a pubkey
# and endpoints — deliberately absent today.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
# A shell this small has no reason to ship a large binary.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
